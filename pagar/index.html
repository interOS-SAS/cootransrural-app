  <script>
    // La cooperativa del cobro llega en ?e=<id> (el QR del conductor). Se fija
    // ANTES de cargar los módulos para que el núcleo lea su ficha y el pago
    // salga por el canal de ESA cooperativa. Solo se aceptan a-z, 0-9 y guiones;
    // sin ?e= es Cootransrural. Si el valor no sirve, se marca y no se paga.
    (function () {
      var pedida = (new URLSearchParams(location.search).get('e') || '').trim().toLowerCase();
      var valida = /^[a-z0-9-]{1,40}$/.test(pedida);
      window.CT_EMPRESA_PEDIDA = pedida || 'cootransrural';
      window.CT_EMPRESA = valida ? pedida : 'cootransrural';
      window.CT_EMPRESA_INVALIDA = Boolean(pedida) && !valida;
    })();
  </script>

  <script>
    // Si el núcleo no carga la ficha (cooperativa que no existe o sin señal), el
    // módulo de pago no arranca: aquí se dice qué pasó en vez de quedar «Cargando…».
    (function () {
      var hecho = false;
      function revisar() {
        if (hecho) return;
        var t = document.getElementById('tarjeta');
        if (!t || !/Cargando el cobro/.test(t.textContent)) return;
        hecho = true;
        var id = window.CT_EMPRESA || 'cootransrural';
        function aviso(titulo, texto, reintentar) {
          t.innerHTML = '<div class="error-pago"><span class="circulo"><svg class="icono"><use href="#i-alerta"/></svg></span><h1>' + titulo + '</h1><p>' + texto + '</p>' +
            (reintentar ? '<button type="button" class="boton boton-amarillo boton-ancho">Reintentar</button>' : '') + '</div>';
          // Sin manejador onclick en línea (la CSP no lo deja).
          var b = t.querySelector('button');
          if (b) b.addEventListener('click', function () { location.reload(); });
        }
        fetch('../empresas/' + id + '/ficha.json', { method: 'HEAD', cache: 'no-cache' }).then(function (r) {
          if (r.status === 404) aviso('No reconocemos la cooperativa de este cobro', 'El código QR no corresponde a ninguna cooperativa de la app. Pídele al conductor que te muestre otra vez el código de cobro o, si prefieres, págale en efectivo.');
          else aviso('No pudimos cargar el cobro', 'Revisa tu conexión a internet e inténtalo de nuevo. Si prefieres, págale al conductor en efectivo.', true);
        }).catch(function () {
          aviso('No pudimos cargar el cobro', 'Revisa tu conexión a internet e inténtalo de nuevo. Si prefieres, págale al conductor en efectivo.', true);
        });
      }
      window.addEventListener('error', function () { setTimeout(revisar, 300); });
      window.addEventListener('unhandledrejection', function () { setTimeout(revisar, 300); });
      setTimeout(revisar, 8000);
    })();
  </script>
