    // Busca la raíz del sitio (sirve en GitHub Pages dentro de un subdirectorio):
    // prueba desde la carpeta más profunda hacia arriba dónde está nucleo/config.js.
    (async () => {
      const partes = location.pathname.split('/').filter(Boolean);
      if (partes.length && /\.[a-z0-9]+$/i.test(partes[partes.length - 1])) partes.pop();
      const candidatas = [];
      for (let i = Math.min(partes.length, 5); i >= 0; i--) candidatas.push(partes.slice(0, i));
      for (const lista of candidatas) {
        const raiz = '/' + lista.map((p) => p + '/').join('');
        try {
          const r = await fetch(raiz + 'nucleo/config.js', { method: 'HEAD', cache: 'no-store' });
          if (!r.ok) continue;
          const siguiente = partes[lista.length] || '';
          const coop = COOPERATIVAS.find((c) => c.ruta && c.ruta === siguiente + '/');
          const base = raiz + (coop ? coop.ruta : '');
          document.querySelectorAll('[data-ruta]').forEach((a) => { a.href = base + a.dataset.ruta; });
          // «Pedir taxi» abre TaxiCun (la app) con la cooperativa de la carpeta.
          document.querySelectorAll('[data-taxicun]').forEach((a) => { a.href = coop ? `${raiz}taxicun/?e=${encodeURIComponent(coop.id)}` : `${raiz}taxicun/`; });
          if (coop) adaptar(coop);
          else document.getElementById('ayuda')?.remove(); // en la raíz es TaxiCun: sin central de una cooperativa
          const fuentes = document.createElement('link');
          fuentes.rel = 'stylesheet';
          fuentes.href = raiz + 'fuentes/fuentes.css';
          document.head.appendChild(fuentes);
          return;
        } catch {
          /* sin red: se dejan los enlaces relativos */
        }
      }
    })();

    function adaptar(coop) {
      const raizCss = document.documentElement.style;
      raizCss.setProperty('--verde', coop.primario);
      raizCss.setProperty('--verde-2', coop.primario2);
      raizCss.setProperty('--verde-3', coop.claro);
      raizCss.setProperty('--verde-osc', coop.oscuro);
      raizCss.setProperty('--amarillo', coop.acento);
      document.title = `Página no encontrada · ${coop.nombre}`;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', coop.primario);
      const ayuda = document.getElementById('ayuda');
      if (coop.tel) {
        const enlace = document.getElementById('ayuda-tel');
        if (enlace) {
          enlace.href = `tel:${coop.tel}`;
          enlace.textContent = coop.tel_visible;
          document.getElementById('ayuda-texto').textContent = `¿Necesitas ayuda? ${coop.servicio24h ? 'Central 24 horas' : 'Central'}:`;
        }
      } else if (ayuda) {
        ayuda.remove();
      }
      if (coop.es_propuesta) {
        const nota = document.getElementById('propuesta');
        nota.textContent = `Propuesta de demostración de TaxiCun, preparada por interOS para ${coop.razonSocial} · No es la página oficial de la cooperativa`;
        nota.hidden = false;
      }
    }
  </script>
