<body>
  <div id="carga"><div style="text-align:center"><img src="../../empresas/fusagasuga-transjardin/icono-192.png" alt=""><p>Transjardín<br><small>Taxis de la Ciudad Jardín</small></p></div></div>
  <div id="app"></div>
  <noscript>Para usar la app de Transjardín activa JavaScript.</noscript>
  <script>
    // Si en 15 s la app no terminó de cargar (sin señal o sin los datos de la
    // cooperativa), se dice en pantalla en vez de quedarse cargando.
    setTimeout(function () {
      var c = document.getElementById('carga');
      if (!c || c.classList.contains('oculta')) return;
      var p = c.querySelector('p');
      if (p) p.innerHTML = 'No pudimos cargar la app.<br><small>Revisa tu conexión a internet e inténtalo de nuevo.</small><br><button type="button" onclick="location.reload()" style="margin-top:14px;min-height:44px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#111;font:700 15px system-ui,sans-serif;cursor:pointer">Reintentar</button>';
      c.querySelector('img') && (c.querySelector('img').style.animation = 'none');
    }, 15000);
  </script>
  <script type="module">
    import * as N from '../../nucleo/index.js';
    const VERSION_DISENOS = 'a90f75c40b';
    const raiz = document.getElementById('app');
    const parametros = new URLSearchParams(location.search);
    const d = N.perfil.disenoElegido();
    document.documentElement.dataset.diseno = d;
    if (parametros.get('movil')) N.perfil.guardarReferido(parametros.get('movil'));
    if (parametros.get('vitrina')) document.documentElement.dataset.vitrina = '1';
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = `../../disenos/${d}/conductor.css?v=${VERSION_DISENOS}`;
    document.head.appendChild(css);
    try {
      const { montar } = await import(`../../disenos/${d}/conductor.js?v=${VERSION_DISENOS}`);
      await montar(raiz, { N, diseno: d, vitrina: Boolean(parametros.get('vitrina')) });
    } catch (e) {
      console.error(e);
      raiz.innerHTML = '<p style="color:#fff;font:16px system-ui;padding:24px">No se pudo abrir el diseño «' + d + '». ' + (e.message || '') + '</p>';
    }
    document.getElementById('carga').classList.add('oculta');
    setTimeout(() => document.getElementById('carga').remove(), 400);
    if (!parametros.get('vitrina')) N.registrarServiceWorker();
  </script>
</body>
