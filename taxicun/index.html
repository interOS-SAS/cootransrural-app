<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TaxiCun · Pide tu taxi</title>
  <meta name="description" content="TaxiCun: pide tu taxi en tu municipio de Cundinamarca con tu ubicación, sigue el móvil en el mapa y paga con QR. Desarrollada por interOS.">
  <meta name="theme-color" content="#0A2552">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaxiCun">
  <link rel="manifest" href="../taxicun/manifest.webmanifest">
  <script>window.CT_TAXICUN = true; window.CT_ROL = 'pasajero';</script>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/taxicun/favicon-32.png">
  <link rel="apple-touch-icon" href="../img/taxicun/apple-touch-icon.png">
  <link rel="stylesheet" href="../fuentes/fuentes.css?v=d7cb94cf69">
  <link rel="stylesheet" href="../web/taxicun.css?v=a9b8c471e3">
</head>
<body>
  <div id="carga" class="tc-carga" role="status" aria-live="polite">
    <div class="tc-carga-centro">
      <img class="tc-carga-icono" src="../img/taxicun/icono-192.png" alt="" width="104" height="104">
      <p class="tc-carga-marca">Taxi<span>Cun</span></p>
      <p class="tc-carga-texto" id="carga-texto">Buscando tu municipio…</p>
      <p class="tc-carga-pie">Desarrollada por interOS</p>
    </div>
  </div>
  <div id="elegir" class="tc-elegir" hidden></div>
  <div id="app"></div>
  <noscript>Para usar TaxiCun activa JavaScript.</noscript>
  <script>
    // Si en 20 s no terminó de cargar (sin señal), se dice en pantalla.
    setTimeout(function () {
      var c = document.getElementById('carga');
      if (!c || c.classList.contains('oculta') || !document.getElementById('elegir').hidden) return;
      document.getElementById('carga-texto').innerHTML = 'No pudimos cargar TaxiCun.<br><small>Revisa tu conexión a internet e inténtalo de nuevo.</small><br><button type="button" class="tc-boton" onclick="location.reload()">Reintentar</button>';
    }, 20000);
  </script>
  <script type="module">
    import { iniciarTaxiCun } from '../web/taxicun.js';
    const VERSION_DISENOS = '721ac56297';
    iniciarTaxiCun({ rol: 'pasajero', version: VERSION_DISENOS });
  </script>
</body>
</html>
