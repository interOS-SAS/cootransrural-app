<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{EMPRESA.nombre}} · Pide tu taxi</title>
  <meta name="description" content="Pide tu taxi de {{EMPRESA.nombre}} en {{EMPRESA.pueblo}} con tu ubicación, sigue el móvil en el mapa y paga con QR.">
  <meta name="theme-color" content="{{colores.primario}}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{EMPRESA.nombreCorto}}">
  <link rel="manifest" href="manifest.webmanifest">
  <script>window.CT_EMPRESA = '{{id}}';</script>
  <link rel="icon" type="image/png" sizes="32x32" href="{{RAIZ}}img/favicon-32.png">
  <link rel="apple-touch-icon" href="{{RAIZ}}img/apple-touch-icon.png">
  <link rel="stylesheet" href="{{RAIZ}}fuentes/fuentes.css">
  <style>
    html,body{margin:0;height:100%;background:{{colores.primario}}}
    #carga{position:fixed;inset:0;display:grid;place-items:center;background:{{colores.primario}};color:#fff;font:600 16px/1.4 system-ui,sans-serif;z-index:9999;transition:opacity .35s}
    #carga img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:latido 1.4s ease-in-out infinite}
    #carga p{margin:16px 0 0;text-align:center;opacity:.85}
    @keyframes latido{50%{transform:scale(1.06)}}
    #carga.oculta{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="carga"><div style="text-align:center"><img src="{{RAIZ}}img/icono-192.png" alt=""><p>{{EMPRESA.nombre}}<br><small>{{EMPRESA.lema}}</small></p></div></div>
  <div id="app"></div>
  <noscript>Para usar la app de Cootransrural activa JavaScript.</noscript>
  <script type="module">
    import * as N from '{{RAIZ}}nucleo/index.js';
    const VERSION_DISENOS = '';
    const raiz = document.getElementById('app');
    const parametros = new URLSearchParams(location.search);
    const d = N.perfil.disenoElegido();
    document.documentElement.dataset.diseno = d;
    if (parametros.get('movil')) N.perfil.guardarReferido(parametros.get('movil'));
    if (parametros.get('vitrina')) document.documentElement.dataset.vitrina = '1';
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = `{{RAIZ}}disenos/${d}/pasajero.css?v=${VERSION_DISENOS}`;
    document.head.appendChild(css);
    try {
      const { montar } = await import(`{{RAIZ}}disenos/${d}/pasajero.js?v=${VERSION_DISENOS}`);
      await montar(raiz, { N, diseno: d, vitrina: Boolean(parametros.get('vitrina')) });
    } catch (e) {
      console.error(e);
      raiz.innerHTML = '<p style="color:#fff;font:16px system-ui;padding:24px">No se pudo abrir el diseño «' + d + '». ' + (e.message || '') + '</p>';
    }
    document.getElementById('carga').classList.add('oculta');
    setTimeout(() => document.getElementById('carga').remove(), 400);
    if (!parametros.get('vitrina')) N.registrarServiceWorker();
  </script>
</body>
</html>
